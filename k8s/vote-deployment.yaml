apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: nginx:latest # Подменяем на надежный Nginx
        imagePullPolicy: IfNotPresent # <--- ДОБАВИТЬ ЭТУ СТРОКУ!

        ports:
        - containerPort: 80