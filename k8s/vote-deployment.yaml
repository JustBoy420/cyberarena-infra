apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberarena-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyberarena
  template:
    metadata:
      labels:
        app: cyberarena
    spec:
      containers:
      - name: frontend
        # Мы будем использовать образ из GHCR. 
        # GITHUB_REPOSITORY_OWNER подставится автоматически в CI/CD
        image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/cyberarena-app:latest
        imagePullPolicy: Always # В CI/CD нам всегда нужен свежий образ
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cyberarena-svc
spec:
  type: ClusterIP
  selector:
    app: cyberarena
  ports:
    - port: 80
      targetPort: 80