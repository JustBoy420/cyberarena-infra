version: '3.8'

services:
  redis:
    image: redis:alpine

  backend:
    image: cyberarena-backend:local
    environment:
      - REDIS_HOST=redis # Compose DNS сам найдет контейнер redis!
    ports:
      - "8081:5000"

  frontend:
    image: cyberarena-frontend:local
    ports:
      - "8080:80"
